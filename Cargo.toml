[package]
name = "stand"
version = "0.1.7"
edition = "2024"
description = "A break timer that covers the screen until you have stood up"
license = "Apache-2.0"
publish = false

[dependencies]
# Current GPUI (https://gpui.rs/) is `gpui` plus `gpui_platform`. The platform
# crate is not published on crates.io, so this follows the Zed git crate at the
# revision whose README documents `gpui_platform::application()`.
gpui = { git = "https://github.com/zed-industries/zed", rev = "06afd454ec3f23b7c97ce7527e9be9e1478564a4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "06afd454ec3f23b7c97ce7527e9be9e1478564a4", features = [
    "font-kit",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release builds keep a symbol table Cargo does not need in the shipped app.
[profile.release]
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
raw-window-handle = "0.6"
